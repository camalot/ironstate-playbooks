---

tasks:
  - name: Include Editors
    include:
      name: roles/development/editors
    when:
      - development | enabled("editors")

  - name: Include Git
    include:
      name: roles/development/git
    when:
      - git | enabled()

  - name: Include EditorConfig
    include:
      name: packages/editorconfig
    when:
      - development.editorconfig | default(true)