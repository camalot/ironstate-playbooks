---

tasks:

  - name: Include Zoxide
    include:
      name: packages/zoxide
    when:
      - shells | enabled('zoxide')

  - name: Include PowerShell
    include:
      name: roles/shells/pwsh
    when:
      - shells | enabled('pwsh')

  - name: Include Zsh
    include:
      name: roles/shells/zsh
    when:
      - shells | enabled('zsh')