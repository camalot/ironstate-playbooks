---

tasks:
  - name: Ensure fish directory exists
    file:
      path: "~/.config/fish"
      state: directory
      mode: "0755"

  - name: Copy fish configuration files
    copy:
      src: files/custom
      dest: "~/.config/fish/custom"
      mode: "0644"


