---

tasks:

  - name: Is WSL Environment
    failed_when: false
    fact:
      name: is_wsl
      shell:
        silent: true
        type: bash
        command: '[ -n "$WSL_DISTRO_NAME" ] && exit 0 || exit 1'
      value: ${{ rc == 0 }}
    when:
      - facts.os_family != 'windows'

  - name: Is WSL2 Environment
    failed_when: false
    fact:
      name: is_wsl2
      shell:
        silent: true
        type: bash
        command: "[ $(uname -r | grep -o 'microsoft-standard-WSL2') ] && exit 0 || exit 1"
      value: ${{ rc == 0 }}
    when:
      - facts.is_wsl is defined and (facts.is_wsl | default(false))

  - name: Is WSL UI Enabled
    failed_when: false
    fact:
      name: is_wsl_ui_enabled
      value: ${{ vars.wsl.ui | default(false) }}
    when:
      - facts.is_wsl is defined and (facts.is_wsl | default(false))
