---

# sets up ironstate package managers

vars:
  defaults:
    scoop:
      buckets:
        - name: camalot
          url: https://github.com/camalot/scoop

tasks:

  - name: Include xget
    include:
      name: packages/xget
  
  - name: Include Scoop
    include:
      name: packages/scoop

  - name: Include PipX
    include:
      name: packages/pipx