---

tasks:

  - name: Install Andcli
    xget:
      package: tjblackheart/andcli
      state: ${{ package.state }}
      args:
        - --to=${{ facts.local_bin_path }}
        - --ignore .sbom.json

  - name: Install totp-cli
    xget:
      package: yitsushi/totp-cli
      state: ${{ package.state }}
      args:
        - --to=${{ facts.local_bin_path }}
        - --ignore ".sbom.json"
        - --ignore ".sig"