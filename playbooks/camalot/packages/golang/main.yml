---

tasks:
  - name: Golang Package
    tags:
      - golang
    actions:
      - name: GOPATH
        fact:
          name: GOPATH
          value: ${{ env("GOPATH") }}

      - name: GOBIN
        fact:
          name: GOBIN
          value: ${{ facts.GOPATH | join("bin") }}
        when:
          - facts.GOPATH is defined
          - facts.GOPATH != ""

      - name: OS PATH Separator
        fact:
          name: os_path_separator
          value: ${{ (facts.platform == "windows") | ternary(";", ":") }}

      - name: GOBIN in PATH
        fact:
          name: gopath_in_path
          value: ${{ (facts.os_path_separator | concat("", env("PATH")) | concat("", facts.os_path_separator)) | contains(facts.os_path_separator | concat("", facts.GOBIN | default("???NOMATCH???")) | concat("", facts.os_path_separator)) }}

      # - name: Register GoHome Environment
      #   include:
      #     name: tasks/shell/path/register
      #     with:
      #       name: GOPATH
      #       path: $HOME/go
      #       env: GOPATH

      # - name: Register GOBIN Environment
      #   include:
      #     name: tasks/shell/path/register
      #     with:
      #       name: GOBIN
      #       path: ${{ facts.GOBIN | default("$HOME/go/bin") }}
      #       env: PATH

      - name: Register GoPath (zsh)
        when:
          - facts.shell_zsh
          - not facts.gopath_in_path
        blockinfile:
          create: false
          dest: ~/.zshrc
          block: |
            if [ -z "$GOPATH" ]; then
              export GOPATH=$HOME/go
              if [ -z "$PATH" ] || [[ ":$PATH:" != *":$GOPATH/bin:"* ]]; then
                export PATH=$PATH:$GOPATH/bin
              fi
            fi

      - name: Register GoPath (bash)
        when:
          - facts.shell_bash
          - not facts.gopath_in_path
        blockinfile:
          create: false
          dest: ~/.bashrc
          block: |
            if [ -z "$GOPATH" ]; then
              export GOPATH=$HOME/go
              if [ -z "$PATH" ] || [[ ":$PATH:" != *":$GOPATH/bin:"* ]]; then
                export PATH=$PATH:$GOPATH/bin
              fi
            fi

      - name: Register GoPath (fish)
        when:
          - facts.shell_fish
          - not facts.gopath_in_path
        blockinfile:
          create: false
          dest: ~/.config/fish/config.fish
          block: |
            if not set -q GOPATH
              set -x GOPATH $HOME/go
              if not contains $GOPATH/bin $PATH
                set -x PATH $PATH $GOPATH/bin
              end
            end

      - name: Register GoPath (powershell)
        when:
          - facts.shell_pwsh
          - not facts.gopath_in_path
        blockinfile:
          create: false
          dest: ${{ shells.pwsh.profile | default((facts.platform == "windows") | ternary("~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1", "~/.config/powershell/Microsoft.PowerShell_profile.ps1")) }}
          block: |
            if (-not $env:GOPATH) {
              $env:GOPATH = Join-Path $HOME 'go'
              $goBin = [IO.Path]::GetFullPath((Join-Path $env:GOPATH 'bin')).TrimEnd([IO.Path]::DirectorySeparatorChar)
              $pathEntries = @($env:PATH -split [IO.Path]::PathSeparator | Where-Object { $_ } | ForEach-Object { [IO.Path]::GetFullPath($_).TrimEnd([IO.Path]::DirectorySeparatorChar) })
              if ($pathEntries -notcontains $goBin) {
                $env:PATH = (@($env:PATH) + $goBin | Where-Object { $_ }) -join [IO.Path]::PathSeparator
              }
            }

      - name: Register GoPath (nushell)
        when:
          - facts.shell_nu
          - not facts.gopath_in_path
        blockinfile:
          create: false
          dest: ~/.config/nushell/config.nu
          block: |
            if not $env:GOPATH {
              set -x GOPATH $HOME/go
              if not $env:PATH | str contains $GOPATH/bin {
                set -x PATH $env:PATH $GOPATH/bin
              end
            end
