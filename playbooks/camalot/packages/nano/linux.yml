---

tasks:

  - name: Install Nano (${{ facts.os_family }})
    actions:
      - name: Install Nano (${{ facts.os_family }})
        apt:
          package: nano
          state: ${{ package.state }}
        become: true
        when:
          - facts.is_debian

      - name: Install Nano (${{ facts.os_family }})
        apk:
          name: nano
          state: ${{ package.state }}
        when:
          - facts.os_family == "alpine"

      - name: Install Nano (${{ facts.os_family }})
        pacman:
          name: nano
          state: ${{ package.state }}
        become: true
        when:
          - facts.os_family == "archlinux"

  - name: Include Nano Configuration
    include:
      name: packages/nano/configuration