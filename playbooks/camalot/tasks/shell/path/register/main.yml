---

tasks:
  - name: Register Path In Shells
    # description: Register a path in various shell environments.
    # inputs:
    #   name:
    #     description: The name of the path being registered.
    #     required: true
    #   path:
    #     description: The path to register in the shell environments.
    #     required: true
    #   env:
    #     description: The name of the environment variable to register the path under.
    #     required: false
    #     default: PATH
    # No 'inputs.*' when here: it cascades into the included profiles tasks, which have different inputs.
    actions:

      - name: Register Path ${{ inputs.name }}
        include:
          name: tasks/shell/profiles
          with:
            name: ${{ inputs.name }}
            bash: |
              if [ -z "$${{ inputs.env }}" ] || [[ ":$${{ inputs.env }}:" != *":${{ inputs.path }}:"* ]]; then
                export ${{ inputs.env }}=$${{ inputs.env }}:${{ inputs.path }}
              fi
            zsh: |
              if [ -z "$${{ inputs.env }}" ] || [[ ":$${{ inputs.env }}:" != *":${{ inputs.path }}:"* ]]; then
                export ${{ inputs.env }}=$${{ inputs.env }}:${{ inputs.path }}
              fi
            fish: |
              if not contains -- ${{ inputs.path }} $${{ inputs.env }}
                set -gx ${{ inputs.env }} $${{ inputs.env }} ${{ inputs.path }}
              end
            powershell: |
              $ironstatePath = [IO.Path]::GetFullPath("${{ inputs.path }}").TrimEnd([IO.Path]::DirectorySeparatorChar)
              $ironstateEntries = @($env:${{ inputs.env }} -split [IO.Path]::PathSeparator | Where-Object { $_ } | ForEach-Object { [IO.Path]::GetFullPath($_).TrimEnd([IO.Path]::DirectorySeparatorChar) })
              if ($ironstateEntries -notcontains $ironstatePath) {
                $env:${{ inputs.env }} = (@($env:${{ inputs.env }}) + $ironstatePath | Where-Object { $_ }) -join [IO.Path]::PathSeparator
              }
            nushell: |
              let ironstate_path = ('${{ inputs.path }}' | str replace '$HOME' $env.HOME)
              if not ($ironstate_path in $env.${{ inputs.env }}) {
                $env.${{ inputs.env }} = ($env.${{ inputs.env }} | append $ironstate_path)
              }
