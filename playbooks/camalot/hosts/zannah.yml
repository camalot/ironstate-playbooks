---

vars: 
  user:
    paths:
      development:
        work: 
          windows: C:/Development/work/
          wsl: /mnt/c/Development/work/
          default: ~/Development/work/
        oss:
          windows: C:/Development/projects/
          wsl: /mnt/c/Development/projects/
          default: ~/Development/oss/

  wsl:
    ui: false

  languages:
    golang: true
    nodejs: true
    python: true
    rust: true

  development:
    editors:
      vscode: false
      micro: true
      nano: true

  shells:
    zoxide: true
    zsh: true
    pwsh:
      omp:
        profile: "~/.config/powershell/default.omp.json"
      profile: "~/.config/powershell/profile.ps1"

  system:
    tools:
      sysinternals: true
      tweaks: true
    monitoring:
      smartctl: false # disabled as it should currently exist.

tasks:

  - name: Include base host configuration
    include:
      name: hosts/base