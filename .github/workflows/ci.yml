---
name: 'ci'
on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - 'playbooks/**'
  pull_request:
    paths:
      - 'playbooks/**'
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      issues: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint Codebase
        uses: camalot/actions/smells/lint@v1
        with:
          token: ${{ github.token }}
          default_branch: main
          super_linter_env_file: .github/linters/super-linter.env
